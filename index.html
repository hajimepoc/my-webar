
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>森の変形菌採取</title>

  <!-- 以前動いていたA-Frame版を使用 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #243c2c;
      color: white;
    }

    /* ARカメラ */
    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* カメラ映像を虫眼鏡型にする */
    .mindar-ui-overlay,
    .mindar-ui-scanning {
      z-index: 2 !important;
    }

    /* タイトル */
    .header {
      position: fixed;
      z-index: 10;
      top: 25px;
      left: 0;
      width: 100%;
      text-align: center;
      letter-spacing: 3px;
      font-size: 18px;
      pointer-events: none;
    }

    /* 虫眼鏡 */
    .magnifier {
      position: fixed;
      z-index: 5;
      width: min(72vw, 65vh);
      aspect-ratio: 1;
      top: 43%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 9px solid #c5a77b;
      border-radius: 50%;
      pointer-events: none;
      box-shadow:
        0 0 0 4px rgba(255,255,255,0.25),
        0 0 25px rgba(0,0,0,0.4);
    }

    .magnifier::after {
      content: "";
      position: absolute;
      width: 22%;
      height: 45%;
      background: #a9875d;
      border: 5px solid #d3b78d;
      border-radius: 20px;
      right: -15%;
      bottom: -32%;
      transform: rotate(-42deg);
      transform-origin: top center;
    }

    /* 案内 */
    .message {
      position: fixed;
      z-index: 10;
      bottom: 15%;
      width: 100%;
      text-align: center;
      font-size: 16px;
      text-shadow: 0 2px 5px black;
      pointer-events: none;
    }

    /* スタート画面 */
    .start-area {
      position: fixed;
      z-index: 20;
      inset: 0;
      background: #243c2c;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      text-align: center;
      padding: 25px;
    }

    .start-area h1 {
      font-size: 25px;
      letter-spacing: 3px;
    }

    button {
      border: none;
      background: #d4bd8b;
      color: #263d2d;
      padding: 15px 35px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    /* ゲット画面 */
    #success {
      display: none;
      position: fixed;
      z-index: 30;
      inset: 0;
      background: rgba(28, 53, 36, 0.96);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
      text-align: center;
      padding: 25px;
    }

    #success h1 {
      font-size: 32px;
      color: #e5d39d;
    }

    #success img {
      width: 180px;
      height: 180px;
      object-fit: contain;
    }

    .sub {
      font-size: 13px;
      opacity: 0.8;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- ARシーン -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- 1番目のマーカー -->
    <a-entity
      id="marker"
      mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <!-- タイトル -->
  <div class="header">
    FOREST EXPLORER
  </div>

  <!-- 虫眼鏡 -->
  <div class="magnifier" id="magnifier"></div>

  <!-- 案内 -->
  <div class="message" id="message">
    森の中から変形菌を探そう
  </div>

  <!-- スタート画面 -->
  <div class="start-area" id="start">
    <h1>森の探索</h1>
    <p>
      虫眼鏡を使って<br>
      森に隠れた変形菌を見つけよう。
    </p>
    <button id="startButton">
      変形菌を採取する
    </button>
  </div>

  <!-- ゲット画面 -->
  <div id="success">
    <h1>変形菌 GET!</h1>

    <img
      src="https://placehold.co/300x300/e7e2bd/49613c?text=SLIME+MOLD"
      alt="獲得した変形菌">

    <p>新しい変形菌を発見した！</p>

    <button id="bookButton">
      図鑑を見る
    </button>

    <p class="sub">
      あなたの図鑑に新しい仲間が加わりました
    </p>
  </div>

  <script>
    const scene = document.querySelector("a-scene");
    const marker = document.querySelector("#marker");

    const startButton = document.querySelector("#startButton");
    const startScreen = document.querySelector("#start");
    const successScreen = document.querySelector("#success");

    const message = document.querySelector("#message");
    const magnifier = document.querySelector("#magnifier");

    let found = false;
    let started = false;

    // マーカーを発見したとき
    marker.addEventListener("targetFound", () => {
      if (found) return;

      found = true;

      message.textContent = "変形菌を発見しました！";
      magnifier.style.borderColor = "#e6d18d";
      successScreen.style.display = "flex";
    });

    // 図鑑へ移動
    document.querySelector("#bookButton")
      .addEventListener("click", () => {
        location.href = "zukan.html";
      });

    // AR開始
    startButton.addEventListener("click", async () => {
      if (started) return;

      startButton.disabled = true;
      startButton.textContent = "カメラを準備中...";

      try {
        const mindarSystem =
          scene.systems["mindar-image-system"];

        if (!mindarSystem) {
          throw new Error("MindARが読み込まれていません。");
        }

        await mindarSystem.start();

        started = true;
        startScreen.classList.add("hidden");

      } catch (error) {
        console.error("AR起動エラー:", error);

        startButton.disabled = false;
        startButton.textContent = "もう一度試す";

        alert(
          "ARの起動に失敗しました。\n\n原因: " +
          (error.message || error)
        );
      }
    });
  </script>

</body>
</html>
